<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Our Studio — Alpha Films</title>
  <meta name="description" content="Professional studio spaces — Amber, Emerald, Indigo. Book now." />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <!-- MAIN CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* ===== FIX: Prevent global overlays breaking layout ===== */
    .studio-hero,
    .studio-grid-section {
      position: relative;
      z-index: 2;
      isolation: isolate;
      background: var(--color-bg-soft);
    }

    /* ===== HERO ===== */
    .studio-hero {
      padding: 5rem 0 2rem; /* reduced from 8rem */
      text-align: center;
      background: var(--color-bg-soft);
      border-bottom: 1px solid var(--color-border);
    }

    .studio-hero h1 {
      font-size: 2.8rem;
      font-weight: 700;
    }

    .studio-hero span {
      color: var(--color-red);
    }

    .studio-hero p {
      color: var(--color-text-muted);
      max-width: 600px;
      margin: 1rem auto 0;
    }

    /* ===== GRID ===== */
    .studio-grid-section {
      padding: 3rem 1rem;
    }

    .studio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }

    @media (max-width: 900px) {
      .studio-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ===== CARD ===== */
    .studio-card {
      background: var(--color-bg-soft);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      overflow: hidden;
      transition: 0.3s ease;
    }

    .studio-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    }

    /* ===== IMAGE ===== */
    .studio-image-container {
      height: 380px;
      overflow: hidden;
      cursor: pointer;
    }

    .studio-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.3s ease;
    }

    .studio-image-container:hover img {
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .studio-image-container {
       height: 300px;
    }

  .studio-hero {
    padding: 4rem 0 2rem;
  }
}
    /* ===== INFO ===== */
    .studio-info {
      padding: 1.4rem;
    }

    .studio-name {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0.5rem;
    }

    .studio-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .amber { background: #f59e0b; }
    .emerald { background: #10b981; }
    .indigo { background: #6366f1; }

    .studio-info h3 {
      margin: 0;
    }

    .studio-info p {
      color: var(--color-text-muted);
      font-size: 0.9rem;
    }

    /* ===== BUTTON ===== */
    .studio-book-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--color-border);
      padding: 8px 14px;
      border-radius: 30px;
      text-decoration: none;
      margin-top: 10px;
      transition: 0.3s;
    }

    .studio-book-btn:hover {
      background: black;
      color: white;
    }

    /* ===== FOOTER SMALL FIX ===== */
    footer {
      margin-top: 3rem;
    }
  </style>
</head>

<body>

<!-- ===== HERO ===== -->
<section class="studio-hero">
  <h1>Our Studio <span>Spaces</span></h1>
  <p>Professionally crafted environments — each with its own mood, light, and character.</p>
</section>

<!-- ===== GRID ===== -->
<section class="studio-grid-section">
  <div class="studio-grid">

    <!-- AMBER -->
    <div class="studio-card">
      <div class="studio-image-container" data-images="images/amber.JPG,images/amber1.JPG">
        <img src="images/amber.JPG">
      </div>
      <div class="studio-info">
        <div class="studio-name">
          <div class="studio-dot amber"></div>
          <h3>Amber</h3>
        </div>
        <p>Warm, cinematic lighting · Perfect for films & portraits</p>
        <a href="https://wa.me/918587090302" target="_blank" class="studio-book-btn">
          <i class="fab fa-whatsapp"></i> Book
        </a>
      </div>
    </div>

    <!-- EMERALD -->
    <div class="studio-card">
      <div class="studio-image-container" data-images="images/emerald.JPG,images/emerald1.JPG">
        <img src="images/emerald.JPG">
      </div>
      <div class="studio-info">
        <div class="studio-name">
          <div class="studio-dot emerald"></div>
          <h3>Emerald</h3>
        </div>
        <p>Clean, bright · Ideal for reels & product shoots</p>
        <a href="https://wa.me/918587090302" target="_blank" class="studio-book-btn">
          <i class="fab fa-whatsapp"></i> Book
        </a>
      </div>
    </div>

    <!-- INDIGO -->
    <div class="studio-card">
      <div class="studio-image-container" data-images="images/indigo.JPG,images/indigo1.JPG">
        <img src="images/indigo.JPG">
      </div>
      <div class="studio-info">
        <div class="studio-name">
          <div class="studio-dot indigo"></div>
          <h3>Indigo</h3>
        </div>
        <p>Bold, dramatic · Perfect for music & fashion</p>
        <a href="https://wa.me/918587090302" target="_blank" class="studio-book-btn">
          <i class="fab fa-whatsapp"></i> Book
        </a>
      </div>
    </div>

  </div>
</section>

<!-- ===== SCRIPT ===== -->
<script>
document.querySelectorAll('.studio-image-container').forEach(container => {
  const images = container.dataset.images.split(',');
  const img = container.querySelector('img');

  let i = 0, interval;

  container.addEventListener('mouseenter', () => {
    interval = setInterval(() => {
      i = (i + 1) % images.length;
      img.src = images[i];
    }, 1800);
  });

  container.addEventListener('mouseleave', () => {
    clearInterval(interval);
    i = 0;
    img.src = images[0];
  });
});
</script>

</body>
</html>
